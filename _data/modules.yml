# _data/modules.yml — 20 модулей платформы «Опора»

- id: vitrina
  name: Опора.Витрина
  icon: shield
  color: "#233370"
  color_class: module-vitrina
  status: BUILD
  description: >
    Каталог верифицированных российских брендов с трёхуровневым грейдированием
    «Золото / Серебро / Бронза», кешбэком до 7%, социальным треком и инструментами
    обратной связи для брендов.
  features:
    - Грейдирование брендов по уровню локализации
    - Кешбэк до 7% (3% государство + до 4% бизнес)
    - Социальный трек — трата баллов на образование, медицину, спорт
    - Амбассадорская программа для активных покупателей

- id: cooperation
  name: Опора.Кооперация
  icon: gears
  color: "#2EC4B6"
  color_class: module-cooperation
  status: BUILD
  description: >
    AI-подбор производственных партнёров по 50+ параметрам, артельные кластеры
    для выполнения крупных заказов, B2B-тендеры и смарт-контракты.
  features:
    - AI-подбор партнёров по мощностям, логистике, специализации
    - Артельные кластеры — объединение МСП под крупный заказ
    - B2B-тендеры с AI-ранжированием
    - Смарт-контракты на Hyperledger Fabric

- id: creators
  name: Опора.Креаторы
  icon: brush
  color: "#4CAF76"
  color_class: module-creators
  status: BUILD
  description: >
    Маркетплейс для самозанятых: дизайнеры, копирайтеры, маркетологи, видеографы.
    Нулевая комиссия на старте, интеграция с «Мой налог».
  features:
    - AI-подбор исполнителя по портфолио и рейтингу
    - Смарт-контракт с автоматическим NDA
    - 0% комиссии для самозанятых
    - Интеграция с «Мой налог»

- id: analytics
  name: Опора.Аналитика
  icon: chart
  color: "#667085"
  color_class: module-analytics
  status: BUILD
  description: >
    Встроенная CRM/CDP-система: портрет покупателя, прогноз спроса, сегментация.
    Data Monetization — пассивный доход гражданам за обезличенные данные.
  features:
    - CRM/CDP для малого бизнеса
    - Прогноз спроса (Temporal Fusion Transformer)
    - Data Monetization — доход баллами за данные
    - Витрины данных для брендов через API

- id: legal
  name: Опора.Право
  icon: scales
  color: "#C62828"
  color_class: module-legal
  status: BUILD
  description: >
    Арбитраж, патентный маркетплейс, типовые смарт-контракты с NDA.
    Франчайзинг-маркетплейс со стандартным мораторием на конкуренцию.
  features:
    - Арбитраж на базе Коллегии РСПП
    - Патентный маркетплейс с блокчейн-учётом роялти
    - Типовые NDA в смарт-контрактах
    - Франчайзинг-маркетплейс

- id: finance
  name: Опора.Финансы
  icon: coin
  color: "#F9A825"
  color_class: module-finance
  status: BUILD
  description: >
    Краудфандинг 2.0: токены участия, интеграция с ЦФА-платформами,
    привлечение инвестиций в проекты МСП от частных лиц до венчурных фондов.
  features:
    - Краудфандинг через ЦФА (интеграция с 20+ операторами)
    - Токены участия для инвесторов
    - Объём рынка ЦФА: 170 млрд руб. (I кв. 2026)
    - Смарт-контракты на цифровом рубле

- id: sandbox
  name: Опора.Песочница
  icon: sprout
  color: "#D7CCC8"
  color_class: module-sandbox
  status: BUILD
  description: >
    Среда для самозанятых и микробизнеса: нулевая комиссия,
    прямая интеграция с «Мой налог», автоматические чеки и налоги.
  features:
    - Нулевая комиссия на старте
    - Автоматическое формирование чеков
    - Интеграция с «Мой налог» (ФНС)
    - Вывод из тени для 8+ млн самозанятых

- id: chains
  name: Опора.Цепочки
  icon: link
  color: "#78909C"
  color_class: module-chains
  status: BUILD
  description: >
    B2B-закупки, блокчейн-прослеживаемость товаров от сырья до прилавка,
    AI-ранжирование поставщиков для крупных тендеров.
  features:
    - B2B-тендеры с AI-ранжированием
    - Блокчейн-прослеживаемость каждой единицы товара
    - Интеграция с ГИСП и «Честным знаком»
    - Критически важно для экспортёров

- id: personnel
  name: Опора.Кадры
  icon: people
  color: "#7E57C2"
  color_class: module-personnel
  status: BUILD
  description: >
    Платформа для найма и верификации компетенций,
    интеграция с вузами, колледжами и образовательными платформами.
  features:
    - Верификация компетенций через блокчейн
    - Интеграция с вузами и колледжами
    - HR-инструменты для МСП без бюджета на рекрутинг
    - Цифровое портфолио специалиста

- id: regions
  name: Опора.Регионы
  icon: map
  color: "#FF8A65"
  color_class: module-regions
  status: BUILD
  description: >
    Геотаргетированная поддержка моногородов, приграничных территорий
    и новых регионов. Региональная дифференциация кешбэка.
  features:
    - Геотаргетинг под специфику региона
    - Региональная дифференциация кешбэка
    - Поддержка моногородов
    - Приграничные и новые территории

- id: export
  name: Опора.Экспорт
  icon: globe
  color: "#1565C0"
  color_class: module-export
  status: BUILD
  description: >
    «Единое окно» для выхода на рынки ЕАЭС и БРИКС: предэкспортная подготовка,
    мультивалютные аккредитивы, интеграция с BRICS Bridge и BRICS Pay.
  features:
    - Предэкспортная подготовка и сертификация
    - Мультивалютные аккредитивы
    - Интеграция с BRICS Bridge
    - White-label для стран-партнёров

- id: loyalty
  name: Опора.Лояльность
  icon: star
  color: "#E91E63"
  color_class: module-loyalty
  status: BUILD
  description: >
    Программа лояльности с балльной системой без НДС: кешбэк до 7%,
    социальный трек (образование, медицина, спорт), многоуровневые привилегии.
  features:
    - Кешбэк до 7% баллами за покупки
    - Баллы без НДС (поправки в ст. 149 НК РФ)
    - Социальный трек: образование, медицина, спорт
    - Многоуровневая программа с привилегиями

- id: payments
  name: Опора.Платежи
  icon: card
  color: "#00897B"
  color_class: module-payments
  status: BUILD
  description: >
    Платёжная инфраструктура: приём платежей через СБП и цифровой рубль,
    маркированные платежи ЦБ РФ, мгновенные расчёты с производителями.
  features:
    - Приём платежей через СБП и цифровой рубль
    - Маркированные платежи ЦБ РФ
    - Мгновенные расчёты B2B и B2C
    - Эскроу-счета для безопасных сделок

- id: auth
  name: Auth Service
  icon: lock
  color: "#5C6BC0"
  color_class: module-auth
  status: BUILD
  description: >
    Единая система аутентификации с перспективой подключения ЕСИА (Госуслуги).
    Keycloak 24, OAuth 2.0/OIDC, защита класса К2 (ФСТЭК №117).
  features:
    - Вход через ЕСИА (Госуслуги) — OAuth 2.0/OIDC
    - Keycloak 24 в роли Identity Provider
    - Класс защиты К2 (ФСТЭК №117)
    - ГОСТ-криптография (КриптоПро CSP 5.0)

- id: gateway
  name: Gateway Service
  icon: door
  color: "#546E7A"
  color_class: module-gateway
  status: BUILD
  description: >
    API Gateway — единая точка входа для всех сервисов: rate limiting,
    проверка JWT-токенов, маршрутизация запросов, BFF-интерфейсы.
  features:
    - Rate limiting на уровне шлюза
    - Проверка JWT-токенов (Keycloak)
    - Маршрутизация на 20 микросервисов
    - Открытый партнёрский API

- id: mock
  name: Mock Service
  icon: flask
  color: "#8D6E63"
  color_class: module-mock
  status: BUILD
  description: >
    8 моков внешних сервисов для разработки и тестирования:
    ЕСИА, ГИСП, «Честный знак», ФНС, ОФД, СБП, ЦФА, BRICS Bridge.
  features:
    - Мок ЕСИА — аутентификация
    - Мок ГИСП — верификация продукции
    - Мок ФНС — «Мой налог»
    - 8 мок-сервисов для изолированной разработки

- id: lk
  name: LK Service
  icon: home
  color: "#43A047"
  color_class: module-lk
  status: BUILD
  description: >
    Личный кабинет (React SPA): дашборд, аналитика продаж, управление заказами,
    финансы, настройки. Адаптивный дизайн, WCAG AA.
  features:
    - Дашборд с аналитикой в реальном времени
    - Управление заказами и товарами
    - Финансовая аналитика и отчёты
    - Мобильная версия (адаптивный дизайн)

- id: bff
  name: BFF Service
  icon: monitor
  color: "#00ACC1"
  color_class: module-bff
  status: BUILD
  description: >
    Backend-for-Frontend — агрегация API-запросов, кеширование ответов (Redis),
    оптимизация данных под клиент, Server-Sent Events для realtime.
  features:
    - Агрегация API-запросов от микросервисов
    - Кеширование ответов (Redis)
    - Оптимизация под клиент (&lt;50ms latency)
    - Server-Sent Events для realtime-обновлений

- id: admin
  name: Admin Service
  icon: gear
  color: "#6D4C41"
  color_class: module-admin
  status: BUILD
  description: >
    Панель администрирования платформы: модерация брендов, контента и транзакций,
    аудит-лог, управление доступом (RBAC).
  features:
    - Модерация брендов и контента
    - Контроль транзакций
    - Аудит-лог всех действий
    - Role-Based Access Control (RBAC)

- id: ai
  name: AI Service
  icon: brain
  color: "#AB47BC"
  color_class: module-ai
  status: BUILD
  description: >
    Центральный AI-узел платформы: рекомендации (CatBoost), прогноз спроса (TFT),
    модерация контента (RuBERT), антифрод (Isolation Forest + XGBoost).
  features:
    - Рекомендации товаров и партнёров (CatBoost)
    - Прогноз спроса (Temporal Fusion Transformer)
    - Модерация контента (RuBERT)
    - Антифрод (Isolation Forest + XGBoost)
